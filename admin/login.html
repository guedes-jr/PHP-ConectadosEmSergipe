<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Conectado em Sergipe</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
    .login-card{background:var(--card);padding:48px;width:100%;max-width:420px;border-radius:var(--radius);box-shadow:var(--shadow)}
    .login-card h1{font-size:1.5rem;text-align:center;margin-bottom:8px}
    .login-card .subtitle{text-align:center;color:var(--muted);margin-bottom:32px}
    .form-group{margin-bottom:20px}
    .form-group label{display:block;margin-bottom:8px;font-weight:600;font-size:.9rem}
    .form-group input{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:12px;font-size:1rem;transition:.2s}
    .form-group input:focus{outline:0;border-color:var(--blue)}
    .login-card .btn{width:100%;justify-content:center;padding:14px}
    .login-footer{text-align:center;margin-top:24px;font-size:.9rem;color:var(--muted)}
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Conectado em Sergipe</h1>
      <p class="subtitle">Acesse seu painel administrativo</p>
      <form action="dashboard.html">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
      <p class="login-footer">Não tem conta? <a href="#" style="color:var(--blue);font-weight:600">Fale no WhatsApp</a></p>
    </div>
  </div>
</body>
</html>
